<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Market Simulator</title>
<style>
:root{
  --bg:#000000; /* pure black */
  --card:#1f2933;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --up:#22c55e;
  --down:#ef4444;
  --accent:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  position:sticky;
  top:0;
  background:#111827;
  padding:10px 15px;
  border-bottom:1px solid #334155;
  z-index:10;
}
.top{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}
.top div{font-weight:600;font-size:16px;}
.news{
  margin:8px auto;
  text-align:center;
  font-size:14px;
  color:#fde68a;
  animation:newsFade .6s;
}
@keyframes newsFade{
  from{opacity:0;transform:translateY(-5px)}
  to{opacity:1;transform:none}
}
.nav{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:6px;
  flex-wrap:wrap;
}
.nav button{
  background:#1e293b;
  color:var(--text);
  border:none;
  padding:6px 14px;
  border-radius:999px;
  cursor:pointer;
}
.nav button.active{
  background:var(--accent);
  color:#022c22;
  font-weight:600;
}
main{
  max-width:1400px;
  margin:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:20px;
}
.graph-card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
}
canvas{
  width:100%;      /* stretch full width */
  height:250px;    /* normal height */
  background: var(--bg);
  border-radius: 10px;
}
.advice{
  margin-top:10px;
  padding:12px;
  border-radius:8px;
  background:#0f172a;
  font-size:14px;
  min-height:70px;
  color:#c7d2fe;
  overflow:hidden;
}
.table-card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.4);
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #334155;
  text-align:center;
}
.stock-name{color:#60a5fa;cursor:pointer}
.stock-name:hover{text-decoration:underline;}
.price-up{color:var(--up)}
.price-down{color:var(--down)}
.flash-up{animation:up .6s}
.flash-down{animation:down .6s}
@keyframes up{
  0%{background:rgba(34,197,94,.3);transform:scale(1.02)}
  100%{background:transparent;transform:none}
}
@keyframes down{
  0%{background:rgba(239,68,68,.3);transform:scale(1.02)}
  100%{background:transparent;transform:none}
}
button.buy,button.sell{
  border:none;border-radius:6px;padding:4px 8px;cursor:pointer;transition:0.2s;
}
button.buy{background:var(--up)}
button.sell{background:var(--down);color:white}
button.buy:hover, button.sell:hover{transform:scale(1.05)}
button.reset{
  margin-top:10px;
  background:#334155;
  color:white;
  border:none;
  border-radius:6px;
  padding:6px 12px;
  cursor:pointer;
}
button.reset:hover{filter:brightness(1.1);}
table tr.selected{background:rgba(56,189,248,0.1);}
.search-bar{
  width:100%;
  margin-bottom:10px;
  padding:6px 12px;
  border-radius:6px;
  border:none;
  background:#1e293b;
  color:#e5e7eb;
}
.search-bar::placeholder{color:#9ca3af;}
</style>
</head>
<body>

<header>
<div class="top">
<div>💰 $<span id="money">100</span></div>
<div>💼 Net $<span id="networth">100</span></div>
<div>🏆 High $<span id="highscore">100</span></div>
</div>
<div class="news" id="news">Market opening…</div>
<div class="nav">
<button class="active" onclick="setCategory('stock',this)">Stocks</button>
<button onclick="setCategory('bullion',this)">Bullion</button>
<button onclick="setCategory('crypto',this)">Crypto</button>
</div>
</header>

<main>
<div class="graph-card">
<h2 id="graphTitle">📈 Select an asset</h2>
<canvas id="graph"></canvas>
<button class="reset" style="margin-top:5px;" onclick="toggleSMA()">Show/Hide SMA</button>
<div class="advice" id="advice">Select an asset to hear the AI advisor.</div>
</div>

<div class="table-card">
<input type="text" class="search-bar" id="searchInput" placeholder="Search asset..." oninput="updateUI()">
<h2>📊 Market</h2>
<table>
<thead>
<tr>
<th>Asset</th><th>Type</th><th>Price</th><th>Owned</th><th></th><th></th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
<button class="reset" onclick="resetGame()">Reset Game</button>
</div>

<script>
// Game variables
let money=100,selected=null,filter="stock",showSMA=true;
let highScore=+localStorage.getItem("highScore")||100;

// News
const newsText={
stock:["Tech stocks wobble","Market searches for direction","Major firms announce products","Unexpected earnings report","Market rallies on new innovation"],
bullion:["Investors seek safety","Bullion holds steady","Demand rises as risk appetite cools"],
crypto:["Crypto swings sharply","Volatility spikes","Traders debate future trends","Altcoins soar","Memecoins catch investor attention"]
};

// Assets
const stockNames=[
"AlphaTech","BetaSoft","CyberCorp","DeltaWare","EcoPower","FutureAI","GreenFuel","HyperNet",
"IonSystems","JetWorks","KryptoLabs","LogicWare","MegaBuild","NanoTech","OmegaOil",
"PixelGames","QuantumInc","RoboWorks","Solaris","TitanSteel","UltraHealth","VertexAI",
"WaveEnergy","XenoLabs","YieldCorp","ZenithTech","ApexIndustries","BlueOcean","CloudNine","DataForge",
"NeoTech","StarLabs","InfinitySoft","NovaWorks","EcoSys","QuantumDynamics","SkylineCorp","LunarTech",
"Photonix","TerraGen","AlphaSystems","BetaWare","CyberSolutions","DeltaDynamics","FutureWorks","OmegaSoft",
"SunPower","GreenDynamics","HydroTech","AstroWorks","Cybernetic","FusionLabs","NanoSystems","EcoWare"
];

let assets=stockNames.map(n=>({name:n,type:"stock",vol:.05,price:Math.random()*20+5,last:0,owned:0,history:[]}));
assets.push(
{name:"Gold Bullion",type:"bullion",vol:.015,price:60,last:0,owned:0,history:[]},
{name:"Silver Bullion",type:"bullion",vol:.02,price:30,last:0,owned:0,history:[]},
{name:"Bitcoin",type:"crypto",vol:.5,price:300,last:0,owned:0,history:[]},
{name:"Ethereum",type:"crypto",vol:.6,price:150,last:0,owned:0,history:[]},
{name:"Dogecoin",type:"crypto",vol:.8,price:50,last:0,owned:0,history:[]},
{name:"MemeCoin",type:"crypto",vol:.9,price:30,last:0,owned:0,history:[]}
);

// DOM
const table=document.getElementById("table");
const canvas=document.getElementById("graph");
const ctx=canvas.getContext("2d");
const advice=document.getElementById("advice");
const news=document.getElementById("news");
const searchInput=document.getElementById("searchInput");

// Save/load
function saveGame(){
localStorage.setItem("money",money);
localStorage.setItem("assets",JSON.stringify(assets.map(a=>({price:a.price,owned:a.owned,history:a.history,type:a.type,name:a.name,vol:a.vol,last:a.last}))));
}
function loadGame(){
const storedMoney=localStorage.getItem("money");
const storedAssets=localStorage.getItem("assets");
if(storedMoney) money=+storedMoney;
if(storedAssets){
const saved=JSON.parse(storedAssets);
assets.forEach((a,i)=>{a.price=saved[i].price;a.owned=saved[i].owned;a.history=saved[i].history;a.last=saved[i].last;});
}
}

// --- Smooth animation ---
let animationStep=0,animationFrames=60;
let animStart=[], animEnd=[];
function startAnimation(){
assets.forEach((a,i)=>{
animStart[i]=a.history[a.history.length-2]||a.price;
animEnd[i]=a.price;
});
animationStep=0;
requestAnimationFrame(animateSmooth);
}
function animateSmooth(){
animationStep++;
assets.forEach((a,i)=>{
let prev=animStart[i], next=animEnd[i];
a.history[a.history.length-1]=prev + (next-prev)*(animationStep/animationFrames);
});
if(animationStep<animationFrames) requestAnimationFrame(animateSmooth);
if(selected!==null) animateGraph();
}

// --- News ---
function rotateNews(){
const n=newsText[filter][Math.floor(Math.random()*newsText[filter].length)];
news.textContent="📰 "+n;
applyNewsEffect(n);
}
setInterval(rotateNews,6000);

function applyNewsEffect(headline){
assets.forEach(a=>{
if(a.type!==filter)return;
let impact=Math.random()*0.05;
if(a.type==="crypto") impact*=5;
if(headline.includes("wobble")||headline.includes("cool")||headline.includes("spikes")||headline.includes("debate")||headline.includes("catch"))impact*=-1;
a.price=Math.max(0.01,a.price*(1+impact));
a.history.push(a.price);
if(a.history.length>200)a.history.shift(); // increase history length
});
startAnimation();
updateUI();
saveGame();
}

// --- UI & logic ---
function updateUI(){
table.innerHTML="";
const searchTerm=searchInput.value.toLowerCase();
assets.forEach((a,i)=>{
if(a.type!==filter) return;
if(!a.name.toLowerCase().includes(searchTerm)) return;
const up=a.price>=a.last;
const selectedClass=(selected===i)?"selected":"";
table.innerHTML+=`<tr class="${up?"flash-up":"flash-down"} ${selectedClass}">
<td class="stock-name" onclick="select(${i})">${a.name}</td>
<td>${a.type}</td>
<td class="${up?"price-up":"price-down"}">${a.price.toFixed(2)}</td>
<td>${a.owned}</td>
<td><button class="buy" onclick="buy(${i})">Buy</button></td>
<td><button class="sell" onclick="sell(${i})">Sell</button></td>
</tr>`;
});
document.getElementById("money").textContent=money.toFixed(2);
const nw=money+assets.reduce((s,a)=>s+a.price*a.owned,0);
document.getElementById("networth").textContent=nw.toFixed(2);
if(nw>highScore){highScore=nw;localStorage.setItem("highScore",highScore);}
document.getElementById("highscore").textContent=highScore.toFixed(2);
}

function buy(i){if(money>=assets[i].price){money-=assets[i].price;assets[i].owned++;updateUI();saveGame();}}
function sell(i){if(assets[i].owned){assets[i].owned--;money+=assets[i].price;updateUI();saveGame();}}

function tick(){
assets.forEach(a=>{
a.last=a.price;
let volatility=a.vol;
if(a.type==="crypto") volatility*=5;
a.price=Math.max(0.01,a.price*(1+(Math.random()*2-1)*volatility+(a.type==="bullion"?0.002:0)));
a.history.push(a.price);
if(a.history.length>200)a.history.shift(); // keep longer history
});
startAnimation();
updateUI();
saveGame();
}
setInterval(tick,2500);

function select(i){
selected=i;
document.getElementById("graphTitle").textContent="📈 "+assets[i].name;
updateAdvice();
animateGraph();
}

// --- AI Advice ---
function updateAdvice(){
if(selected===null) return;
const a = assets[selected];
const recent = a.history.slice(-10);
const avgChange = (recent[recent.length-1]-recent[0])/recent[0];
let trend="", adviceText="", typeText="";
if(a.type==="crypto") typeText="Cryptocurrency";
else if(a.type==="stock") typeText="Stock";
else typeText="Precious Metal";

if(avgChange > 0.03) trend="rising momentum 📈";
else if(avgChange < -0.03) trend="falling momentum 📉";
else trend="stable ⬌";

const netWorth=money+assets.reduce((s,x)=>s+x.price*x.owned,0);
let exposure=a.price*a.owned;
let maxRiskFraction=(a.type==="crypto")?0.2:0.5;
let safeUnits=Math.floor((netWorth*maxRiskFraction)/a.price);
if(safeUnits<1) safeUnits=1;

let prediction=avgChange*3;
let buyProb=50, sellProb=50;
if(a.type==="crypto") {buyProb=Math.min(95, Math.max(5, 50+prediction*100)); sellProb=100-buyProb;}
else if(a.type==="stock") {buyProb=Math.min(80, Math.max(20, 50+prediction*50)); sellProb=100-buyProb;}
else {buyProb=50; sellProb=50;}

let suggestedUnitsBuy = Math.min(safeUnits, Math.floor((money*buyProb/100)/a.price));
if(suggestedUnitsBuy<1) suggestedUnitsBuy=1;
let suggestedUnitsSell = Math.min(a.owned, Math.floor(a.owned*sellProb/100));
if(suggestedUnitsSell<1 && a.owned>0) suggestedUnitsSell=1;

if(buyProb>65) adviceText=`AI Suggestion: Strong Buy! Buy ~${suggestedUnitsBuy} units (${buyProb.toFixed(0)}% confidence)`;
else if(buyProb>50) adviceText=`AI Suggestion: Buy cautiously. Buy ~${suggestedUnitsBuy} units (${buyProb.toFixed(0)}%)`;
else if(sellProb>65) adviceText=`AI Suggestion: Consider Selling ~${suggestedUnitsSell} units (${sellProb.toFixed(0)}% confidence).`;
else adviceText=`AI Suggestion: Hold.`;

if(a.type==="crypto" && avgChange>0.1) adviceText+=` ⚠️ High volatility! Buy smaller amounts to manage risk.`;

advice.textContent=`${typeText} is currently ${trend}. ${adviceText}`;
}

function toggleSMA(){showSMA=!showSMA;animateGraph();}

function animateGraph(){
if(selected===null)return;
const d=assets[selected].history;
if(d.length<2)return;
const min=Math.min(...d);
const max=Math.max(...d);
ctx.clearRect(0,0,canvas.width,canvas.height);

// SMA
if(showSMA){
ctx.beginPath();ctx.strokeStyle="#3b82f6";ctx.lineWidth=2;
for(let i=0;i<d.length;i++){
const slice=d.slice(Math.max(0,i-9),i+1);
const avg=slice.reduce((a,b)=>a+b,0)/slice.length;
const x=i/(d.length-1)*canvas.width;
const y=canvas.height-(avg-min)/(max-min)*canvas.height;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.stroke();
}

// Price line
ctx.beginPath();ctx.strokeStyle="#22c55e";ctx.lineWidth=2;
for(let i=0;i<d.length;i++){
const x=i/(d.length-1)*canvas.width;
const y=canvas.height-(d[i]-min)/(max-min)*canvas.height;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.stroke();
}

function setCategory(c,btn){filter=c;selected=null;document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");rotateNews();updateUI();}

function resetGame(){
money=100;
assets.forEach(a=>{
a.owned=0;
if(a.type==="crypto"){
  if(a.name==="Bitcoin") a.price=300+Math.random()*50;
  else if(a.name==="Ethereum") a.price=150+Math.random()*30;
  else if(a.name==="Dogecoin") a.price=50+Math.random()*20;
  else if(a.name==="MemeCoin") a.price=30+Math.random()*10;
} else if(a.type==="bullion") a.price=Math.random()*20+50;
else a.price=Math.random()*20+5;
a.history=[];a.last=a.price;
});
selected=null;
document.getElementById("graphTitle").textContent="📈 Select an asset";
advice.textContent="Select an asset to hear the AI advisor.";
updateUI();saveGame();
}

loadGame();rotateNews();updateUI();
</script>

</body>
</html>
